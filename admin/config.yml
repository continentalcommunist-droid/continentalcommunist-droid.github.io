  - name: reading_paths
    label: Reading Paths
    label_singular: Reading Path
    icon: route
    folder: /_reading_paths
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{number}} — {{title}} — {{level}}"
    sortable_fields: [number, title, level]
    fields:
      - { label: Layout, name: layout, widget: hidden, default: learning-path }
      - { label: Content Type, name: content_type, widget: hidden, default: Learning Path }
      - { label: Section, name: section, widget: hidden, default: learn }
      - { label: Section Key, name: section_key, widget: hidden, default: learn }
      - { label: Slug, name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and hyphens.'] }
      - { label: Number, name: number, widget: string, pattern: ['^[0-9]{2}$', 'Use a two-digit number such as 01.'] }
      - { label: Title, name: title, widget: string }
      - { label: Level, name: level, widget: select, options: [Introductory, General, Intermediate, Advanced, Academic / Technical] }
      - label: Author / Curator
        name: author
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role]
      - label: Thinkers Included
        name: thinkers
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role, description, aliases]
        multiple: true
        required: false
        hint: Select each thinker separately, including coauthors.
      - { label: Regions, name: region, widget: select, multiple: true, required: false, options: [United States, North America, Latin America and the Caribbean, Europe, Africa, Middle East and North Africa, South Asia, East and Southeast Asia, Global] }
      - { label: Historical Periods, name: historical_period, widget: select, multiple: true, required: false, options: [Pre-1800, 1800-1865, Reconstruction and Gilded Age (1865-1900), Progressive Era and World War I (1900-1919), Interwar and New Deal (1919-1945), Cold War (1945-1991), Post-Cold War (1991-2008), Contemporary (2008-present), Multiple periods] }
      - { label: Languages, name: languages, widget: select, multiple: true, default: [English], options: [English, Spanish] }
      - { label: Estimated Effort, name: effort, widget: string }
      - { label: Prerequisite Summary, name: prerequisite_summary, widget: string }
      - { label: Prerequisites, name: prerequisites, widget: list }
      - { label: Description, name: description, widget: text }
      - { label: Introduction, name: introduction, widget: text }
      - { label: Summary, name: summary, widget: text }
      - { label: Learning Outcomes, name: outcomes, widget: list }
      - label: Topics
        name: topics
        widget: relation
        collection: topics
        value_field: name
        display_fields: [name]
        search_fields: [name, description]
        multiple: true
        min: 1
        max: 5
      - label: Curriculum Stages
        name: stages
        widget: list
        required: false
        summary: "Stage {{fields.number}} — {{fields.title}} — {{fields.weeks}}"
        fields:
          - { label: Stage Number, name: number, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Weeks, name: weeks, widget: string, hint: "Example: Weeks 1–4" }
          - { label: Focus, name: focus, widget: text }
          - { label: Stage Objectives, name: objectives, widget: list, required: false }
      - label: Readings
        name: readings
        widget: list
        min: 1
        summary: "{{fields.title}} — {{fields.author}}"
        fields:
          - { label: ID, name: id, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and hyphens.'] }
          - label: Book / Text Record
            name: text
            widget: relation
            collection: books
            value_field: "{{slug}}"
            display_fields: [title, authors, publication_year]
            search_fields: [title, authors, isbn]
            required: false
            hint: Link the reusable record when one exists; legacy display fields remain below.
          - { label: Author Display, name: author, widget: string }
          - { label: Title Display, name: title, widget: string }
          - { label: Curriculum Stage, name: stage, widget: string, required: false, hint: "Example: Stage I · Method and materialism" }
          - { label: Schedule, name: schedule, widget: string, required: false, hint: "Example: Week 2 or Weeks 7–8" }
          - { label: Assigned Scope, name: scope, widget: text }
          - { label: Reading URL, name: url, widget: string, hint: Internal reading-list anchor or canonical external text URL. }
      - label: Lecture Guides
        name: lectures
        widget: list
        min: 1
        summary: "{{fields.title}} — {{fields.duration}}"
        fields:
          - { label: ID, name: id, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and hyphens.'] }
          - { label: Title, name: title, widget: string }
          - { label: Duration, name: duration, widget: string }
          - { label: Summary, name: summary, widget: text }
          - { label: Outline, name: outline, widget: list, min: 1 }
      - { label: Discussion Questions, name: questions, widget: list, min: 1 }
      - label: Glossary
        name: glossary
        widget: list
        min: 1
        summary: "{{fields.term}}"
        fields:
          - { label: Term, name: term, widget: string }
          - { label: Definition, name: definition, widget: text }

  - divider: true

  # ========================================================
  # Knowledge graph and reusable references
  # ========================================================

  - name: books
    label: Books / Texts
    label_singular: Book / Text
    icon: auto_stories
    folder: /_books
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: "{{title}} — {{authors}}"
    sortable_fields: [title, publication_year]
    fields:
      - { label: Layout, name: layout, widget: hidden, default: book }
      - { label: Content Type, name: content_type, widget: hidden, default: Book / Text }
      - { label: Section Key, name: section_key, widget: hidden, default: library }
      - { label: Title, name: title, widget: string }
      - label: Authors / Creators
        name: authors
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role, description, aliases]
        multiple: true
      - { label: Publication Year, name: publication_year, widget: number, value_type: int, min: 1400, max: 2100, required: false }
      - { label: Publisher / Publication, name: publication, widget: string, required: false }
      - { label: Source URL, name: source_url, widget: string, required: false }
      - { label: DOI, name: doi, widget: string, required: false }
      - { label: ISBN, name: isbn, widget: string, required: false }
      - { label: Text Type, name: text_type, widget: select, options: [Book, Essay, Speech, Letter, Pamphlet, Report, Primary document, Journal article, Chapter, Other] }
