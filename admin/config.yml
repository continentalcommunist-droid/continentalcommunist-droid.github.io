    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Content Type, name: content_type, widget: hidden, default: Brief }
      - { label: Search Schema Type, name: schema_type, widget: hidden, default: NewsArticle }
      - { label: Section, name: section, widget: hidden, default: briefings }
      - { label: Section Key, name: section_key, widget: hidden, default: briefings }
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text }
      - { label: Publication Date, name: date, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { label: Substantive Update Date, name: updated, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - label: Author
        name: author
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role]
      - label: Editor
        name: editor
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role]
        required: false
      - label: Thinkers Discussed
        name: thinkers
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role, description, aliases]
        multiple: true
        required: false
      - label: Topics
        name: topics
        widget: relation
        collection: topics
        value_field: name
        display_fields: [name]
        search_fields: [name, description, synonyms]
        multiple: true
        min: 1
        max: 5
      - { label: Regions, name: region, widget: select, multiple: true, required: false, options: [United States, North America, Latin America and the Caribbean, Europe, Africa, Middle East and North Africa, South Asia, East and Southeast Asia, Global] }
      - label: Historical Periods
        name: historical_period
        widget: select
        multiple: true
        required: false
        options: [Pre-1800, 1800-1865, Reconstruction and Gilded Age (1865-1900), Progressive Era and World War I (1900-1919), Interwar and New Deal (1919-1945), Cold War (1945-1991), Post-Cold War (1991-2008), Contemporary (2008-present), Multiple periods]
      - { label: Reading Level, name: reading_level, widget: select, default: General, options: [Introductory, General, Intermediate, Advanced, Academic / Technical] }
      - { label: Languages, name: languages, widget: select, multiple: true, default: [English], options: [English, Spanish] }
      - { label: Estimated Reading Time, name: reading_time, widget: number, value_type: int, min: 1, required: false, hint: Minutes. }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Featured Image Description, name: image_alt, widget: string, required: false, hint: Required when a featured image is supplied. }
      - label: Key Developments
        name: developments
        widget: list
        required: false
        summary: "{{fields.headline}}"
        fields:
          - { label: Headline, name: headline, widget: string }
          - { label: Materialist Context, name: context, widget: text }
          - label: Sources
            name: sources
            widget: relation
            collection: sources
            value_field: "{{slug}}"
            display_fields: [title, authors, date]
            search_fields: [title, authors, publication]
            multiple: true
      - label: Sources / References
        name: sources
        widget: relation
        collection: sources
        value_field: "{{slug}}"
        display_fields: [title, authors, date]
        search_fields: [title, authors, publication, doi]
        multiple: true
        required: false
      - { label: Editorial Stage, name: editorial_stage, widget: select, default: Draft, options: [Commissioned, Source plan, Draft, Developmental edit, Factual / citation check, Risk / legal review, Copy edit, Accessibility / metadata check, Ready to publish, Published / monitoring] }
      - { label: Brief, name: body, widget: richtext }

  - divider: true

