title: Continental Communist
tagline: American Marxist education and analysis
description: Continental Communist is an independent publication offering Marxist education, materialist analysis, briefings, and primary-source study from an American perspective.
url: "https://www.continentalcommunist.com"
baseurl: ""
lang: en-US
timezone: America/New_York
logo: /assets/images/logo.png

# This organization node is reused by page and article structured data.
publisher:
  name: Continental Communist
  type: Organization
  url: https://www.continentalcommunist.com
  logo: /assets/images/logo.png
  description: Continental Communist is an independent American publication for Marxist education, materialist analysis, and evidence-led study.
  alternate_names:
    - continentalcommunist.com

# Google Search Console's HTML-file ownership proof. Keep this file at the site
# root after verification so Google can recheck ownership when necessary.
google_site_verification_file: googled448df15e8eebf72.html

# Optional HTML-tag fallback. Paste only the content value from Google's meta
# tag; the head include omits the tag while this is blank.
google_site_verification: ""

author: Continental Communist

# Public Supabase browser configuration. These values are intentionally blank
# until a project is created and its migration is applied. The publishable key
# is safe to expose in a browser only because every learner table is protected
# by the row-level security policies in supabase/migrations/.
supabase:
  url: "https://ginfntjdmehgpjlsccni.supabase.co"
  publishable_key: "sb_publishable_4mZVpheO4wqKwHa9ym6MVw_VCkIk4A8"
  javascript_version: "2.112.4"

theme: minima

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed

show_excerpts: true

# Ship the smallest production stylesheet; source maps remain available through
# the uncompiled SCSS in the repository and do not belong in the public build.
sass:
  style: compressed
  sourcemap: never

# Keep development, validation, and benchmark artifacts out of the published
# GitHub Pages output. Only production content and runtime assets are copied.
exclude:
  - .github
  - docs
  - node_modules
  - performance
  - scripts
  - supabase
  - tmp
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - assets/images/title.png
  - assets/images/uploads/banner2.png
  - assets/images/uploads/figures.png

# Structured content managed through Sveltia CMS. Each collection represents a
# product object in the editorial content model rather than an ad hoc tag group.
collections:
  briefs:
    output: true
    permalink: /briefings/:name/
  courses:
    output: true
    permalink: /learn/courses/:name/
  lessons:
    output: true
    permalink: /learn/lessons/:name/
  reading_paths:
    output: true
    permalink: /learn/pathways/:name/
  books:
    output: true
    permalink: /library/texts/:name/
  sources:
    output: true
    permalink: /library/sources/:name/
  people:
    output: true
    permalink: /people/:name/
  concepts:
    output: true
    permalink: /learn/concepts/:name/
  topics:
    output: true
    permalink: /topics/:name/
  events:
    output: true
    permalink: /multimedia/events/:name/
  podcasts:
    output: true
    permalink: /multimedia/podcast/:name/
  redirects:
    output: true
