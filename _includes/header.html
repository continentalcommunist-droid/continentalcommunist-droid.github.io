<header class="site-header" role="banner">

  <div class="wrapper cc-header-inner">

    <a class="site-logo" rel="author" href="{{ "/" | relative_url }}">
      <img
        src="{{ "/assets/images/logo.png" | relative_url }}"
        alt="{{ site.title | escape }}"
      >
    </a>


    <div class="cc-header-actions">

      {%- if site.data.navigation.main -%}
      <nav class="site-nav" aria-label="Primary navigation">

        <input type="checkbox" id="nav-trigger" class="nav-trigger" />

        <label for="nav-trigger" aria-label="Toggle navigation">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484S0.665,0,1.484,0h15.032C17.335,0,18,0.665,18,1.484z"/>
              <path d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516s0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516z"/>
              <path d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516s0.665-1.484,1.484-1.484h15.032C17.335,12.031,18,12.696,18,13.516z"/>
            </svg>
          </span>
        </label>

        <div class="trigger" id="primary-navigation">
          <ul class="cc-primary-nav">
            {%- for item in site.data.navigation.main -%}
            <li class="cc-nav-item{% if page.section_key == item.key %} is-active{% endif %}">
              <a
                class="cc-nav-link"
                href="{{ item.url | relative_url }}"
                {% if page.section_key == item.key %}aria-current="page"{% endif %}
              >
                {{ item.title | escape }}
              </a>

              {%- if item.children -%}
              <ul class="cc-nav-submenu" aria-label="{{ item.title | escape }} sections">
                {%- for child in item.children -%}
                <li>
                  <a href="{{ child.url | relative_url }}">
                    {{ child.title | escape }}
                  </a>
                </li>
                {%- endfor -%}
              </ul>
              {%- endif -%}
            </li>
            {%- endfor -%}
          </ul>
        </div>

      </nav>
      {%- endif -%}


      <a
        class="cc-header-search"
        href="{{ "/search/" | relative_url }}"
        aria-label="Search"
        title="Search"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M10.5 3a7.5 7.5 0 1 0 4.73 13.32l4.72 4.73
               1.42-1.42-4.73-4.72A7.5 7.5 0 0 0 10.5 3Zm0 2
               a5.5 5.5 0 1 1 0 11
               5.5 5.5 0 0 1 0-11Z"
          />
        </svg>

        <span class="cc-visually-hidden">
          Search
        </span>

      </a>

    </div>

  </div>

</header>
