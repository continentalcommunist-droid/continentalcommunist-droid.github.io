{%- assign citation_number = nil -%}
{%- for reference in page.references -%}
  {%- if reference.source == include.source -%}
    {%- assign citation_number = forloop.index -%}
  {%- endif -%}
{%- endfor -%}
{%- if citation_number -%}<sup class="cc-inline-citation"><a href="#reference-{{ citation_number }}" aria-label="Reference {{ citation_number }}">[{{ citation_number }}]</a></sup>{%- endif -%}
