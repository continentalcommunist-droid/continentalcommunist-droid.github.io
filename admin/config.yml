# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: continentalcommunist-droid/continentalcommunist-droid.github.io
  branch: main
  # This site uses Sveltia's access-token sign-in and simple workflow. Restrict
  # the login choices to the configured method so editors do not enter the
  # unconfigured OAuth flow.
  auth_methods: [token]

# Keep Sveltia's default simple workflow. The previous editorial workflow
# created a branch, commit, pull request, and issue label for every save. The
# browser token could write the branch but GitHub rejected the additional
# pull-request/issue calls, leaving a partial save and surfacing “Resource not
# accessible by personal access token.” Simple workflow commits entries and
# uploads directly to main using the token's working Contents permission.

site_url: https://www.continentalcommunist.com
display_url: https://www.continentalcommunist.com

media_folder: /assets/images/uploads
public_folder: /assets/images/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # ========================================================
  # Editorial publishing
  # ========================================================

  - name: posts
    label: Articles
    label_singular: Article
    icon: article
    folder: /_posts
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{content_type}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields:
      fields: [date, title, content_type, author]
      default:
        field: date
        direction: descending
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Title, name: title, widget: string, hint: The public headline. }
      - { label: Summary, name: description, widget: text, hint: A one- or two-sentence standfirst used in cards, search, and metadata. }
      - { label: Publication Date, name: date, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { label: Substantive Update Date, name: updated, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: Use only when the substance changes, not for typo fixes. }
      - label: Content Type
        name: content_type
        widget: select
        default: Analysis
        options: [News, Analysis, Opinion / Debate, Education, Primary Source, Review]
      - label: Search Schema Type
        name: schema_type
        widget: select
        default: Article
        options: [Article, NewsArticle]
        hint: Use NewsArticle only for timely, reported news. Analysis, opinion, education, primary sources, and reviews use Article.
      - { label: Section, name: section, widget: hidden, default: analysis }
      - { label: Section Key, name: section_key, widget: hidden, default: analysis }
      - label: Author
        name: author
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role, description]
      - label: Editor
        name: editor
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role]
        required: false
      - label: Thinkers Discussed
        name: thinkers
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role, description, aliases]
        multiple: true
        required: false
      - label: Topics
        name: topics
        widget: relation
        collection: topics
        value_field: name
        display_fields: [name]
        search_fields: [name, description, synonyms]
        multiple: true
        min: 1
        max: 5
      - label: Regions
        name: region
        widget: select
        multiple: true
        required: false
        options: [United States, North America, Latin America and the Caribbean, Europe, Africa, Middle East and North Africa, South Asia, East and Southeast Asia, Global]
      - label: Historical Periods
        name: historical_period
        widget: select
        multiple: true
        required: false
        options:
          - Pre-1800
          - 1800-1865
          - Reconstruction and Gilded Age (1865-1900)
          - Progressive Era and World War I (1900-1919)
          - Interwar and New Deal (1919-1945)
          - Cold War (1945-1991)
          - Post-Cold War (1991-2008)
          - Contemporary (2008-present)
          - Multiple periods
      - label: Reading Level
        name: reading_level
        widget: select
        default: General
        options: [Introductory, General, Intermediate, Advanced, Academic / Technical]
      - { label: Languages, name: languages, widget: select, multiple: true, default: [English], options: [English, Spanish] }
      - { label: Estimated Reading Time, name: reading_time, widget: number, value_type: int, min: 1, required: false, hint: Minutes. }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Featured Image Description, name: image_alt, widget: string, required: false, hint: Required when a featured image is supplied. Describe the image for readers who cannot see it. }
      - { label: Feature on Homepage, name: featured, widget: boolean, default: false, required: false }
      - label: Structured References
        name: references
        widget: list
        required: false
        summary: "{{fields.source}} — {{fields.evidence_role}}"
        hint: Add normalized sources in citation order. Explain how each source supports, contextualizes, or challenges the article.
        fields:
          - label: Source Record
            name: source
            widget: relation
            collection: sources
            value_field: "{{slug}}"
            display_fields: [title, authors, organizational_author, date]
            search_fields: [title, authors, organizational_author, publication, doi, isbn]
          - { label: Evidence Role, name: evidence_role, widget: select, options: [Direct evidence, Primary context, Background / context, Counterevidence, Method / data, Further reading] }
          - { label: Pinpoint / Locator, name: locator, widget: string, required: false, hint: Page, chapter, section, timestamp, table, or dataset field. }
          - { label: Evidence Note, name: note, widget: text, hint: State what this source establishes and any important limitation. }
      - label: Related Concepts
        name: concepts
        widget: relation
        collection: concepts
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title, summary, aliases]
        multiple: true
        required: false
      - label: Related People
        name: people
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role, description]
        multiple: true
        required: false
      - label: Correction History
        name: corrections
        widget: list
        required: false
        summary: "{{fields.date}} — {{fields.summary}}"
        fields:
          - { label: Date, name: date, widget: datetime, type: date, format: YYYY-MM-DD }
          - { label: Summary, name: summary, widget: text }
          - { label: Public Notice, name: public_notice, widget: boolean, default: true }
      - label: Assignment Brief
        name: assignment_brief
        widget: object
        required: false
        hint: Complete before drafting; this remains editorial metadata.
        fields:
          - { label: Factual Question, name: factual_question, widget: text, required: false }
          - { label: Thesis, name: thesis, widget: text, required: false }
          - { label: Claims Requiring Primary Evidence, name: primary_evidence, widget: text, required: false }
          - { label: Reporting vs. Interpretation, name: reporting_vs_interpretation, widget: text, required: false }
          - { label: Opposing Evidence / Interpretation, name: opposing_evidence, widget: text, required: false }
          - { label: Legal / Reputational Risk, name: risk, widget: select, options: [Routine, Elevated, Legal review required], default: Routine }
      - label: Editorial Stage
        name: editorial_stage
        widget: select
        default: Draft
        options: [Commissioned, Source plan, Draft, Developmental edit, Factual / citation check, Risk / legal review, Copy edit, Accessibility / metadata check, Ready to publish, Published / monitoring]
      - { label: AI Assistance Disclosure, name: ai_assistance, widget: text, required: false, hint: Record material AI use and the human verification performed. }
      - { label: Article, name: body, widget: richtext }

  - name: briefs
    label: Briefings
    label_singular: Brief
    icon: breaking_news
    folder: /_briefs
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    identifier_field: title
    sortable_fields:
      fields: [date, title, author]
