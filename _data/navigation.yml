main:
  - key: learn
    title: Learn
    url: /learn/
    description: Structured introductions, guided study, and reference tools for learning Marxist political economy.
    children:
      - id: start-here
        title: Start Here
        url: /learn/#start-here
        description: A guided entry point for readers who are new to Marxism and scientific socialism.
        status: Available
        target: /reading-list/#where-to-start
        cta: Begin with the reading path
      - id: courses
        title: Courses
        url: /learn/#courses
        description: Structured sequences that connect lessons, texts, concepts, and contemporary examples.
        status: Planned
      - id: reading-paths
        title: Reading Paths
        url: /learn/#reading-paths
        description: Curated routes through foundational texts and major debates, organized by level and theme.
        status: In development
        target: /reading-list/
        cta: Explore the current reading list
      - id: glossary
        title: Glossary
        url: /learn/#glossary
        description: Plain-language definitions with links to thinkers, texts, and analysis.
        status: Planned
      - id: reference-guides
        title: Timelines, Thinkers & Concepts
        url: /learn/#reference-guides
        description: Reference guides that place ideas, people, and events in historical context.
        status: Planned

  - key: analysis
    title: Analysis
    url: /analysis/
    description: Evidence-rich essays that use political economy and historical inquiry to interpret American society.
    children:
      - id: political-economy
        title: Political Economy
        url: /analysis/#political-economy
        description: Class, ownership, finance, production, and the organization of economic power.
        status: Active
      - id: labor
        title: Labor
        url: /analysis/#labor
        description: Work, unions, workplace power, labor history, and class formation.
        status: Active
      - id: american-institutions
        title: American Institutions
        url: /analysis/#american-institutions
        description: Democracy, constitutional government, parties, and the state.
        status: Active
      - id: technology
        title: Technology
        url: /analysis/#technology
        description: Automation, artificial intelligence, industrial change, and productive capacity.
        status: Active
      - id: social-infrastructure
        title: Housing, Health & Infrastructure
        url: /analysis/#social-infrastructure
        description: The material systems that organize everyday life and social reproduction.
        status: Active
      - id: international
        title: International
        url: /analysis/#international
        description: Foreign policy, imperialism, development, and the world economy.
        status: Active

  - key: briefings
    title: Briefings
    url: /briefings/
    description: Concise, contextual updates for following events without losing the longer historical view.
    children:
      - id: latest
        title: Latest
        url: /briefings/#latest
        description: Timely explainers and annotated updates from Continental Communist.
        status: In development
      - id: weekly
        title: Weekly Continental Briefing
        url: /briefings/#weekly
        description: A planned weekly synthesis of the events, evidence, and ideas worth following.
        status: Planned

