title: Continental Communist
description: An American perspective on scientific socialism.
url: "https://www.continentalcommunist.com"
baseurl: ""
lang: en-US
timezone: America/New_York
logo: /assets/images/logo.png

# This organization node is reused by page and article structured data.
publisher:
  name: Continental Communist
  type: Organization
  url: https://www.continentalcommunist.com
  logo: /assets/images/logo.png

# Search Console supplies this value. Paste only the content value from its
# HTML verification tag; the head include omits the tag while this is blank.
google_site_verification: ""

author: Continental Communist

theme: minima

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed

show_excerpts: true

# Ship the smallest production stylesheet; source maps remain available through
# the uncompiled SCSS in the repository and do not belong in the public build.
sass:
  style: compressed
  sourcemap: never

# Keep development, validation, and benchmark artifacts out of the published
# GitHub Pages output. Only production content and runtime assets are copied.
exclude:
  - .github
  - docs
  - node_modules
  - performance
  - scripts
  - tmp
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - assets/images/title.png
  - assets/images/uploads/banner2.png
  - assets/images/uploads/figures.png

# Structured content managed through Sveltia CMS. Each collection represents a
# product object in the editorial content model rather than an ad hoc tag group.
collections:
  briefs:
    output: true
    permalink: /briefings/:name/
  courses:
    output: true
    permalink: /learn/courses/:name/
  lessons:
    output: true
    permalink: /learn/lessons/:name/
  reading_paths:
    output: true
    permalink: /learn/pathways/:name/
  books:
    output: true
    permalink: /library/texts/:name/
  sources:
    output: true
    permalink: /library/sources/:name/
  people:
    output: true
    permalink: /people/:name/
  concepts:
    output: true
    permalink: /learn/concepts/:name/
  topics:
    output: true
    permalink: /topics/:name/
  events:
    output: true
    permalink: /multimedia/events/:name/
  podcasts:
    output: true
    permalink: /multimedia/podcast/:name/
  redirects:
    output: true
