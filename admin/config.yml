    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    sortable_fields: [course, order, title]
    fields:
      - { label: Layout, name: layout, widget: hidden, default: page }
      - { label: Content Type, name: content_type, widget: hidden, default: Lesson }
      - { label: Section Key, name: section_key, widget: hidden, default: learn }
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text }
      - label: Course
        name: course
        widget: relation
        collection: courses
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title, description]
