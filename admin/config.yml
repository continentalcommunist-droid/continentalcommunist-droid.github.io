      - { label: Content Type, name: content_type, widget: hidden, default: Course }
      - { label: Section Key, name: section_key, widget: hidden, default: learn }
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text }
      - { label: Status, name: status, widget: select, default: Planning, options: [Planning, Draft, Enrollment open, Published, Archived] }
      - { label: Level, name: level, widget: select, options: [Introductory, General, Intermediate, Advanced, Academic / Technical] }
      - { label: Regions, name: region, widget: select, multiple: true, required: false, options: [United States, North America, Latin America and the Caribbean, Europe, Africa, Middle East and North Africa, South Asia, East and Southeast Asia, Global] }
      - { label: Historical Periods, name: historical_period, widget: select, multiple: true, required: false, options: [Pre-1800, 1800-1865, Reconstruction and Gilded Age (1865-1900), Progressive Era and World War I (1900-1919), Interwar and New Deal (1919-1945), Cold War (1945-1991), Post-Cold War (1991-2008), Contemporary (2008-present), Multiple periods] }
      - { label: Languages, name: languages, widget: select, multiple: true, default: [English], options: [English, Spanish] }
      - { label: Estimated Effort, name: effort, widget: string, hint: "Example: 8 weeks · 4–5 hours per week" }
      - label: Instructors
        name: instructors
