version: 1

governance:
  max_topics_per_item: 5
  review_interval: Quarterly
  steward: Editorial team

topic_families:
  - name: Marxist Theory
    description: Method, value, class, socialism, and traditions of Marxist analysis.
  - name: Political Economy
    description: Production, markets, planning, finance, development, and the world economy.
  - name: American History
    description: Institutions, constitutional development, reconstruction, and political transformation in the United States.
  - name: Labor
    description: Work, unions, class formation, workplace power, and labor movements.
  - name: Race
    description: Racial formation, citizenship, hierarchy, labor, and political economy.
  - name: Democracy
    description: Participation, representation, institutions, accountability, and political power.
  - name: Technology
    description: Technical change, automation, artificial intelligence, ownership, and control.

