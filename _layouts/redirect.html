<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <title>Redirecting to {{ page.redirect_to }}</title>
  </head>
  <body>
    <p>
      This page has moved to
      <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to }}</a>.
    </p>
  </body>
</html>
