      - { label: Publisher, name: publisher, widget: string, required: false }
      - { label: Publication Date, name: date, widget: string, hint: Use the date as printed, or n.d. when no date is available. }
      - { label: Edition, name: edition, widget: string, required: false }
      - { label: Volume, name: volume, widget: string, required: false }
      - { label: Issue, name: issue, widget: string, required: false }
      - { label: Pages, name: pages, widget: string, required: false }
      - { label: Canonical URL, name: source_url, widget: string, required: false }
      - { label: DOI, name: doi, widget: string, required: false, hint: Store the bare identifier, not a doi.org URL. }
      - { label: ISBN, name: isbn, widget: string, required: false }
      - { label: Access Date, name: access_date, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { label: Source Type, name: source_type, widget: select, options: [Primary document, Book, Journal article, Government report, Research report, Dataset, News report, Website, Archive, Audio / Video, Other] }
      - { label: Primary Source, name: primary_source, widget: boolean, default: false }
