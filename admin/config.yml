      - { label: Section Key, name: section_key, widget: hidden, default: library }
      - { label: Title, name: title, widget: string }
      - { label: Citation Key, name: cite_key, widget: string, pattern: ['^[a-z][a-z0-9]+$', 'Use a stable lowercase key such as marx1867capital.'], hint: Never reuse or casually change this key after publication. }
      - label: Authors / Creators
        name: authors
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
