      - label: Thinkers Discussed
        name: thinkers
        widget: relation
        collection: people
        value_field: name
        display_fields: [name, role]
        search_fields: [name, role, description, aliases]
        multiple: true
        required: false
      - label: Prerequisite Courses
        name: prerequisites
        widget: relation
        collection: courses
        value_field: "{{slug}}"
        display_fields: [title, level]
        search_fields: [title, description]
        multiple: true
        required: false
      - label: Reading Paths
        name: reading_paths
        widget: relation
        collection: reading_paths
        value_field: slug
        display_fields: [title, level]
        search_fields: [title, description, topics]
        multiple: true
        required: false
      - label: Lessons
        name: lessons
        widget: relation
        collection: lessons
        value_field: "{{slug}}"
        display_fields: [title, course, order]
        search_fields: [title, description]
        multiple: true
        required: false
      - label: Topics
        name: topics
        widget: relation
        collection: topics
        value_field: name
        display_fields: [name]
        search_fields: [name, description]
        multiple: true
        min: 1
        max: 5
      - { label: Learning Outcomes, name: outcomes, widget: list }
      - label: Sources / References
        name: sources
        widget: relation
