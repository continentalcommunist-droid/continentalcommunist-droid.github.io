  - name: sources
    label: Sources / References
    label_singular: Source / Reference
    icon: source
    folder: /_sources
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: "{{title}} — {{source_type}} — {{date}}"
